apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web-tests
  description: The site's vitest suites (the template's own Button tests and ours — the page, the name seam, the health route, the env schema, the stories as portable stories, the Worker config), run with pnpm test, and a Storybook build check
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: tests
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    # The app's own Vitest suite (components/**/*.test.tsx) runs with this
    # one, and the template's Storybook must still build: the checks its
    # check.yml ran that need no browser.
    preBuildCommand: pnpm exec turbo run test build-storybook --filter=./ --filter=@app/web
  labels:
    team: platform
    layer: test
